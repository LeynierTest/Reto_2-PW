<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Formulario de registro del sitio Mozilla Firefox">
    <meta name="keywords" content="registro, formulario, Mozilla Firefox">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mozilla Firefox - Formulario de Registro</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <div class="contenedor">

        <header>
            <div class="banner">
                <img src="img/banner.jpg" alt="Mozilla Firefox">
            </div>
        </header>


        <div class="contenido">

            <main>
                <h2>Formulario de Registro:</h2>

                <form id="formularioRegistro" novalidate>

                    <fieldset>
                        <legend>Entrada de datos</legend>

                        <div class="campo">
                            <label for="nombre">Nombre</label>
                            <input type="text" id="nombre" name="nombre">
                            <span class="error" id="errorNombre"></span>
                        </div>

                        <div class="campo">
                            <label for="ci">CI</label>
                            <input type="text" id="ci" name="ci"
                                   inputmode="numeric" maxlength="11">
                            <span class="error" id="errorCi"></span>
                        </div>

                        <div class="campo">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" name="password">
                            <span class="error" id="errorPassword"></span>
                        </div>

                        <div class="campo campo-final">
                            <label for="confirmacion">Confirmación</label>
                            <div class="fila-confirmacion">
                                <input type="password" id="confirmacion"
                                       name="confirmacion">
                                <div class="botones">
                                    <button type="submit">Enviar</button>
                                    <button type="reset">Limpiar</button>
                                </div>
                            </div>
                            <span class="error" id="errorConfirmacion"></span>
                        </div>

                        <div id="mensajeGeneral"></div>

                    </fieldset>

                </form>
            </main>

            <nav>
                <a href="index.html">Inicio</a>
                <a href="registro.html">Formulario de registro</a>
            </nav>

        </div>

        <footer>
            Evaluación Final realizada por
            <a href="#">Leynier</a>.
            Estándares web empleados: XHTML 1.0 Strict y CSS 1.0
        </footer>

    </div>

    <script src="js/validacion.js"></script>
</body>
</html>
